<style>
:root{--ink:#122033;--muted:#718096;--line:#e6ebf2;--accent:#0f766e;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#fbfcfe,#edf4f5);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.top{max-width:1050px;margin:auto;padding:18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:850;font-size:21px;letter-spacing:.5px}.gear{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:12px}
.wrap{max-width:1050px;margin:auto;padding:5px 18px 45px}
.totalGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.total{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:24px;padding:27px;box-shadow:0 18px 45px #0f172a18}
.total.monthly{background:linear-gradient(135deg,#134e4a,#0f766e)}
.label{text-transform:uppercase;font-size:12px;letter-spacing:1.7px;opacity:.7}.value{font-size:42px;font-weight:900;margin-top:7px}
.search{width:100%;margin:16px 0;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;box-shadow:0 12px 28px #0f766e25}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:15px;box-shadow:0 9px 28px #0f172a09;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hidden{display:none!important}#drawer:target{display:flex!important;align-items:stretch}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:750}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:var(--accent);color:#fff;padding:11px 15px;border-radius:12px;font-weight:750}.secondary{background:#eef2f5;color:#243447;padding:11px 15px;border-radius:12px;font-weight:750}
.months{display:flex;flex-wrap:wrap;gap:7px}.month{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:13px}.month.on{background:#dcf3ef;border-color:#81c8c0;color:#075e57;font-weight:800}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f5}.small{font-size:12px;color:var(--muted)}
.drawer{position:fixed;inset:0;background:#0f172a66;z-index:9999}.drawerBox{height:100%;width:min(380px,90vw);background:#fff;padding:20px;animation:slide .22s ease;overflow:auto}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
.menu{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;background:#f5f7fa;border-radius:12px;font-weight:750}
.menu:hover{background:#e8eeee}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#102a2a;color:#fff;padding:12px 17px;border-radius:13px;z-index:10000;animation:pop .2s ease}
.receipt{border:1px dashed #aeb9c6;border-radius:16px;padding:20px;background:#fff;max-width:520px;margin:auto}.receipt h2{text-align:center;margin:0 0 14px}.receiptLine{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1f5}
.settingTitle{font-size:18px;font-weight:850;margin:15px 0 8px}.notice{padding:12px;border-radius:12px;background:#f3f7f7;margin-top:10px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.totalGrid{grid-template-columns:1fr}.value{font-size:35px}.top{padding:14px}.wrap{padding:5px 12px 35px}}
</style>
<style>
@media print{
  body{background:#fff!important}
  .top,.search,.card,.gear,.actions button{display:none!important}
  .drawer{position:static!important;background:#fff!important}
  .drawerBox{width:100%!important;height:auto!important;box-shadow:none!important}
}
</style></head>
<body><script>
// Settings must work independently of Supabase loading.
window.openSettings=function(){var d=document.getElementById('drawer');if(d){d.classList.remove('hidden');d.setAttribute('aria-hidden','false');}};
window.closeSettings=function(){var d=document.getElementById('drawer');if(d){d.classList.add('hidden');d.setAttribute('aria-hidden','true');}};
document.addEventListener('DOMContentLoaded',function(){
  var b=document.getElementById('settingsBtn'), c=document.getElementById('closeSettings'), d=document.getElementById('drawer');
  if(b)b.addEventListener('click',window.openSettings);
  if(c)c.addEventListener('click',window.closeSettings);
  if(d)d.addEventListener('click',function(e){if(e.target===d)window.closeSettings();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')window.closeSettings();});
});
</script>

<script>
const URL='https://lfyejyjwyoovocsrolma.supabase.co';
const KEY='sb_publishable_SR_WZ5siIOFLTy5az-Qemw_0rTfVW-G';
const db=true; // REST connection: no external Supabase JS library required.
const apiHeaders={
  'apikey':KEY,
  'Authorization':'Bearer '+KEY,
  'Content-Type':'application/json'
};
async function apiSelect(table, order='id'){
  try{
    const r=await fetch(`${URL}/rest/v1/${table}?select=*&order=${order}.asc`,{headers:apiHeaders});
    const j=await r.json();
    return r.ok?{data:j,error:null}:{data:null,error:j};
  }catch(e){return {data:null,error:e}}
}
async function apiInsert(table,row){
  try{
    const r=await fetch(`${URL}/rest/v1/${table}`,{
      method:'POST',
      headers:{...apiHeaders,'Prefer':'return=representation'},
      body:JSON.stringify(row)
    });
    const j=await r.json();
    return r.ok?{data:Array.isArray(j)?j:j?[j]:[],error:null}:{data:null,error:j};
  }catch(e){return {data:null,error:e}}
}
async function apiUpdate(table,values,column,value){
  try{
    const r=await fetch(`${URL}/rest/v1/${table}?${encodeURIComponent(column)}=eq.${encodeURIComponent(value)}`,{
      method:'PATCH',
      headers:{...apiHeaders,'Prefer':'return=representation'},
      body:JSON.stringify(values)
    });
    const j=await r.json();
    return r.ok?{data:Array.isArray(j)?j:j?[j]:[],error:null}:{data:null,error:j};
  }catch(e){return {data:null,error:e}}
}
let data=[],months=new Set(),last=null;

const $=id=>document.getElementById(id);
const money=n=>'QAR '+Number(n||0).toFixed(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function toast(x){
  $('toast').textContent=x;
  $('toast').classList.remove('hidden');
  setTimeout(()=>$('toast').classList.add('hidden'),1800);
}

function openSettings(){
  const d=$('drawer'); if(!d) return;
  d.classList.remove('hidden');
  $('drawer').setAttribute('aria-hidden','false');
}
function closeSettings(){
  const d=$('drawer'); if(!d) return;
  d.classList.add('hidden');
  $('drawer').setAttribute('aria-hidden','true');
}
window.openSettings=openSettings; window.closeSettings=closeSettings;

function showSetting(title,html){
  $('settingContent').innerHTML='<div class="settingTitle">'+title+'</div>'+html;
}

$('namesBtn').addEventListener('click', async ()=>{
  await renderMembers();
});

async function loadMembers(){
  if(!db) return;
  let r=await apiSelect('members');
  if(r.error){ console.warn('members load failed', r.error); return; }
  members = r.data || [];

  // Import any existing entry names/codes into members once, so old saved
  // payments remain available after introducing the permanent member list.
  const existing = new Map();
  for(const x of data){
    if(x.code && x.name && !existing.has(x.code)) existing.set(x.code, x.name);
  }
  const missing = [...existing.entries()].filter(([code,name]) =>
    !members.some(m=>m.code===code)
  );
  if(missing.length){
    const ins = await apiInsert('members',
      missing.map(([code,name])=>({code,name,mobile:null}))
    );
    if(!ins.error) members = [...members, ...(ins.data||[])];
  }
  syncMemberNamesToForms();
}

let members=[];

function nextMemberCode(){
  let max=0;
  for(const m of members){
    const n=String(m.code||'').match(/^C(\d+)$/i);
    if(n) max=Math.max(max, Number(n[1]));
  }
  for(const x of data){
    const n=String(x.code||'').match(/^C(\d+)$/i);
    if(n) max=Math.max(max, Number(n[1]));
  }
  return 'C'+String(max+1).padStart(4,'0');
}

function syncMemberNamesToForms(){
  const list = members.length ? members : data.map(x=>({code:x.code,name:x.name}));
  const unique = [];
  const seen = new Set();
  for(const m of list){
    const key=String(m.code||'')+'|'+String(m.name||'');
    if(m.name && !seen.has(key)){seen.add(key);unique.push(m);}
  }
  $('en').innerHTML='<option value="">Select name</option>'+
    unique.map(m=>`<option value="${esc(m.code)}">${esc(m.name)}</option>`).join('');
  $('en').onchange=()=>{
    const code=$('en').value;
    const m=unique.find(x=>x.code===code);
    $('ec').value=m?.code||'';
  };
}

async function saveNewMember(){
  if(!db) return toast('Database connection unavailable');
  const nameEl=$('newMemberName'), mobileEl=$('newMemberMobile');
  const name=(nameEl?.value||'').trim();
  const mobile=(mobileEl?.value||'').trim();

  if(!name) return toast('Name required');
  if(members.some(m=>String(m.name).toLowerCase()===name.toLowerCase()))
    return toast('Name already exists');

  const code=nextMemberCode();
  const r0=await apiInsert('members',{code,name,mobile:mobile||null});
  const r={data:r0.data?.[0],error:r0.error};
  if(r.error){
    console.error(r.error);
    return toast('Could not save name');
  }

  members.push(r.data);
  syncMemberNamesToForms();
  await renderMembers();
  toast('✓ '+name+' saved as '+code);
}

function addMember(){
  const box=$('newMemberForm');
  if(!box) return;
  box.innerHTML=`
    <div class="field">
      <label>Name</label>
      <input id="newMemberName" type="text" placeholder="Enter name" autocomplete="off">
    </div>
    <div class="field">
      <label>Mobile Number</label>
      <input id="newMemberMobile" type="tel" placeholder="Enter mobile number" inputmode="tel" autocomplete="tel">
    </div>
    <div class="actions">
      <button class="primary" type="button" onclick="saveNewMember()">💾 Save Name</button>
      <button class="secondary" type="button" onclick="$('newMemberForm').innerHTML=''">Cancel</button>
    </div>`;
  $('newMemberName').focus();
}
async function renameMember(id){
  if(!db) return;
  const m=members.find(x=>String(x.id)===String(id));
  if(!m) return;

  const name=prompt('Edit name (Code '+m.code+' cannot be changed)',m.name);
  if(name===null) return;
  const newName=name.trim();
  if(!newName) return toast('Name required');
  if(members.some(x=>String(x.id)!==String(m.id) &&
      String(x.name).toLowerCase()===newName.toLowerCase()))
    return toast('Name already exists');

  const mobile=prompt('Edit mobile number',m.mobile||'');
  if(mobile===null) return;

  const r0=await apiUpdate('members',{name:newName,mobile:mobile.trim()||null},'id',m.id);
  const r={data:r0.data?.[0],error:r0.error};
  if(r.error) return toast('Could not update member');

  const e=await apiUpdate('entries',{name:newName},'code',m.code);
  if(e.error) console.warn('Entry name sync failed',e.error);

  m.name=newName;
  m.mobile=mobile.trim();
  data=data.map(x=>x.code===m.code?{...x,name:newName}:x);
  syncMemberNamesToForms();
  refresh();
  await renderMembers();
  toast('✓ Member updated');
}
async function renderMembers(){
  const rows = members.map(m=>`
    <div class="row">
      <div>
        <b>${esc(m.name)}</b>
        <div class="small">Code: ${esc(m.code)}</div>
        <div class="small">Mobile: ${esc(m.mobile||'—')}</div>
      </div>
      <button class="secondary" type="button" onclick="renameMember(${Number(m.id)})">Edit</button>
    </div>`).join('');

  showSetting('Name & Code',`
    <div class="notice">
      <b>Permanent Code system</b><br>
      New names automatically receive C0001, C0002, C0003…<br>
      Code cannot be edited. Name and mobile number can be edited later.
    </div>
    <div class="actions">
      <button class="primary" type="button" onclick="addMember()">＋ Add Name</button>
    </div>
    <div id="newMemberForm" style="margin-top:10px"></div>
    <div style="margin-top:10px">
      ${rows || '<div class="small">No names saved yet. Tap “Add Name”.</div>'}
    </div>`);
}
async function renderReports(){
  if(!members.length) await loadMembers();
  const months=reportMonthOptions();
  const people=[...members].sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  const firstMonth=months[0] || new Date().toISOString().slice(0,7);

  showSetting('Reports',`
    <div class="notice">
      <b>Monthly Collection Report</b><br>
      Given / Not Given status and total collection for the selected month.
    </div>
    <div class="field" style="margin-top:12px">
      <label>Month</label>
      <select id="reportMonth">
        ${months.map(m=>`<option value="${esc(m)}" ${m===firstMonth?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
      </select>
    </div>
    <div class="actions">
      <button class="primary" type="button" id="monthReportBtn">Show Monthly Report</button>
      <button class="secondary" type="button" id="printReportBtn">🖨 Print</button>
    </div>
    <div id="reportSummary"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <div class="notice">
      <b>Person-wise Report</b><br>
      Check one person's Given / Not Given status month by month.
    </div>
    <div class="field" style="margin-top:12px">
      <label>Person</label>
      <select id="reportPerson">
        <option value="">Select person</option>
        ${people.map(m=>`<option value="${esc(m.code)}">${esc(m.name)} — ${esc(m.code)}</option>`).join('')}
      </select>
    </div>
    <div id="personReport"></div>`);

  $('monthReportBtn').addEventListener('click',()=>buildMonthReport($('reportMonth').value));
  $('reportMonth').addEventListener('change',()=>buildMonthReport($('reportMonth').value));
  $('reportPerson').addEventListener('change',()=>buildPersonReport($('reportPerson').value));
  $('printReportBtn').addEventListener('click',()=>window.print());
  buildMonthReport(firstMonth);
}
$('permissionsBtn').addEventListener('click',()=>{
 showSetting('User Permissions',
 '<div class="notice"><b>Master Admin:</b> shafithuyyath<br><br>Master Admin-ന് Admin/User permissions manage ചെയ്യാനുള്ള secure system അടുത്ത ഘട്ടത്തിൽ ചേർക്കാം.</div>');
});

async function load(){
 if(!db){toast('Database connection unavailable');return}
 let r=await apiSelect('entries');
 if(r.error){toast('Database error');return}
 data=r.data||[];
 await loadMembers();
 refresh();
}

function refresh(){
 let names=[...new Set(data.map(x=>x.name).filter(Boolean))];
 let codes=[...new Set(data.map(x=>x.code).filter(Boolean))];
 syncMemberNamesToForms();
 $('sn').innerHTML='<option value="">All saved names</option>'+names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 $('sc').innerHTML='<option value="">All saved codes</option>'+codes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 $('total').textContent=money(data.reduce((s,x)=>s+Number(x.amount||0),0));
 let now=new Date();
 let currentMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 let monthlyTotal=data.filter(x=>x.month===currentMonth).reduce((s,x)=>s+Number(x.amount||0),0);
 $('monthlyTotal').textContent=money(monthlyTotal);
 $('monthlyLabel').textContent=' · '+currentMonth;
 buildMonths();searchRows();
}

function buildMonths(){
 let m=[...new Set(data.map(x=>x.month).filter(Boolean))].sort().reverse();
 $('months').innerHTML=m.map(x=>`<button type="button" class="month ${months.has(x)?'on':''}" onclick="pickMonth('${x}')">${x}</button>`).join('')||'<span class="small">Saved months will appear here</span>';
}
function pickMonth(m){months.has(m)?months.delete(m):months.add(m);buildMonths();}

function searchRows(){
 let a=[...data],n=$('sn').value,c=$('sc').value,am=$('sa').value,q=$('sr').value.trim().toLowerCase();
 if(n)a=a.filter(x=>x.name===n);if(c)a=a.filter(x=>x.code===c);if(am)a=a.filter(x=>Number(x.amount)===Number(am));
 if(months.size)a=a.filter(x=>months.has(x.month));if(q)a=a.filter(x=>(x.remarks||'').toLowerCase().includes(q));
 let t=a.reduce((s,x)=>s+Number(x.amount||0),0);
 $('results').innerHTML=`<div class="small" style="padding:12px 0">${a.length} result(s) · Total ${money(t)}</div>`+
 a.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> <span class="small">${esc(x.code)}</span><div class="small">${esc(x.month)} · ${esc(x.remarks||'')}</div></div><b>${money(x.amount)}</b></div>`).join('')+
 (a.length?'':'<div class="small">No matching saved records.</div>');
}
function clearSearch(){$('sn').value='';$('sc').value='';$('sa').value='';$('sr').value='';months.clear();buildMonths();searchRows();}

$('searchBtn').addEventListener('click',()=>{$('search').classList.toggle('hidden');});
$('doSearch').addEventListener('click',searchRows);
$('clearSearchBtn').addEventListener('click',clearSearch);

async function save(){if(!db)return toast('Database connection unavailable');
 let name=$('en').value,code=$('ec').value,amount=Number($('ea').value),month=$('em').value,remarks=$('er').value.trim();
 if(!name||!code||!amount||!month)return toast('Complete Name, Amount and Month');
 if(!members.some(m=>m.code===code && m.name===name))return toast('Select a saved Name & Code');
 if(data.some(x=>x.code===code&&x.month===month))return toast('Payment already saved for this month');
 let r0=await apiInsert('entries',{code,name,amount,month,remarks}); let r={data:r0.data?.[0],error:r0.error};
 if(r.error)return toast('Save failed');
 data.push(r.data);last={...r.data,date:new Date().toLocaleDateString('en-GB')};
 refresh();receipt();clearEntry();toast('✓ Payment saved');
}
$('saveBtn').addEventListener('click',save);

$('clearBtn').addEventListener('click',clearEntry);

 <div class="receiptLine"><span>Code</span><b>${esc(r.code)}</b></div>
 <div class="receiptLine"><span>Month</span><b>${esc(r.month)}</b></div>
 <div class="receiptLine"><span>Date</span><b>${r.date}</b></div>
 <div class="receiptLine"><span>Amount</span><b>${money(r.amount)}</b></div>
 <div class="receiptLine"><span>Remarks</span><b>${esc(r.remarks||'-')}</b></div>`;

}
function share(){
