async function apiSelect(table, order='id'){

async function loadMembers(){
  if(!db) return;
  let r=await apiSelect('members');
  if(r.error){ console.warn('members load failed', r.error); return; }
  members = r.data || [];

  // Import any existing entry names/codes into members once, so old saved
  // payments remain available after introducing the permanent member list.
  const existing = new Map();
  for(const x of data){
    if(x.code && x.name && !existing.has(x.code)) existing.set(x.code, x.name);
  }
  const missing = [...existing.entries()].filter(([code,name]) =>
    !members.some(m=>m.code===code)
  );
  if(missing.length){
    const ins = await apiInsert('members',
      missing.map(([code,name])=>({code,name,mobile:null}))
    );
    if(!ins.error) members = [...members, ...(ins.data||[])];
  }
  syncMemberNamesToForms();
}

let members=[];

function nextMemberCode(){
  let max=0;
  for(const m of members){
    const n=String(m.code||'').match(/^C(\d+)$/i);
    if(n) max=Math.max(max, Number(n[1]));
  }
  for(const x of data){
    const n=String(x.code||'').match(/^C(\d+)$/i);
    if(n) max=Math.max(max, Number(n[1]));
  }
  return 'C'+String(max+1).padStart(4,'0');
}

function syncMemberNamesToForms(){
  const list = members.length ? members : data.map(x=>({code:x.code,name:x.name}));
  const unique = [];
  const seen = new Set();
  for(const m of list){
    const key=String(m.code||'')+'|'+String(m.name||'');
    if(m.name && !seen.has(key)){seen.add(key);unique.push(m);}
  }
  $('en').innerHTML='<option value="">Select name</option>'+
    unique.map(m=>`<option value="${esc(m.code)}">${esc(m.name)}</option>`).join('');
  $('en').onchange=()=>{
    const code=$('en').value;
    const m=unique.find(x=>x.code===code);
    $('ec').value=m?.code||'';
  };
}

function reportMonths(){
  const set=new Set();
  data.forEach(x=>{if(x.month)set.add(x.month)});
  const now=new Date();
  set.add(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  return [...set].sort().reverse();
}
function reportMonthLabel(v){
  if(!v)return '';
  const p=v.split('-');
  if(p.length!==2)return v;
  return new Date(+p[0],+p[1]-1,1).toLocaleString(undefined,{month:'long',year:'numeric'});
}
function reportPayment(code,month){return data.find(x=>x.code===code&&x.month===month)}
function statusMark(p){
  return p ? '<span class="status-ok" title="Given">✓</span>' : '<span class="status-no" title="Not Given">✕</span>';
}
function monthsBetween(from,to){
  if(!from||!to)return [];
  let a=from.split('-').map(Number), b=to.split('-').map(Number);
  let start=new Date(a[0],a[1]-1,1), end=new Date(b[0],b[1]-1,1);
  if(start>end){const t=start;start=end;end=t;}
  const out=[];
  while(start<=end){out.push(start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0'));start.setMonth(start.getMonth()+1)}
  return out;
}
function buildMonthlyReport(from,to,status='all'){
  const range=monthsBetween(from,to);
  const list=[...members].sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  let given=0,notGiven=0,total=0;
  const rows=list.map(m=>{
    const payments=range.map(month=>reportPayment(m.code,month)).filter(Boolean);
    const isGiven=payments.length>0;
    if(isGiven){given++;total+=payments.reduce((s,p)=>s+Number(p.amount||0),0)}else notGiven++;
    if(status==='given'&&!isGiven)return '';
    if(status==='not'&&isGiven)return '';
    const detail=range.map(month=>{
      const p=reportPayment(m.code,month);
      return `<div style="white-space:nowrap">${esc(reportMonthLabel(month))}: ${p?statusMark(p)+' '+money(p.amount):statusMark(null)}</div>`;
    }).join('');
    return `<tr><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.mobile||'—')}</td><td>${detail}</td><td>${isGiven?money(payments.reduce((s,p)=>s+Number(p.amount||0),0)):'—'}</td></tr>`;
  }).join('');
  const rangeLabel=range.length===1?reportMonthLabel(range[0]):`${reportMonthLabel(range[0])} → ${reportMonthLabel(range[range.length-1])}`;
  $('monthlyReportBox').innerHTML=`
    <div class="reportSummary"><b>${esc(rangeLabel)}</b><br>
    ✓ Given: <b>${given}</b> · ✕ Not Given: <b>${notGiven}</b> · Total: <b>${money(total)}</b></div>
    <div style="overflow:auto;margin-top:10px"><table class="reportTable">
    <thead><tr><th>Code</th><th>Name</th><th>Mobile</th><th>Monthly Status</th><th>Total Amount</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="5">No matching members.</td></tr>'}</tbody></table></div>
    <div class="actions" style="margin-top:12px"><button class="primary" type="button" id="shareMonthlyReport">📱 Share Report to WhatsApp</button></div>`;
  $('shareMonthlyReport').addEventListener('click',()=>shareMonthlyReport(from,to,status));
}
function shareMonthlyReport(from,to,status){
  const range=monthsBetween(from,to);
  const list=[...members].sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  const filtered=list.filter(m=>{
    const has=range.some(month=>!!reportPayment(m.code,month));
    return status==='given'?has:status==='not'?!has:true;
  });
  const given=list.filter(m=>range.some(month=>!!reportPayment(m.code,month))).length;
  const notGiven=list.length-given;
  const total=list.reduce((sum,m)=>sum+range.reduce((s,month)=>{const p=reportPayment(m.code,month);return s+(p?Number(p.amount||0):0)},0),0);
  const rangeLabel=range.length===1?reportMonthLabel(range[0]):`${reportMonthLabel(range[0])} → ${reportMonthLabel(range[range.length-1])}`;
  let t=`AYALVASIKAL\nMonthly Report - ${rangeLabel}\n\n✓ Given: ${given}\n✕ Not Given: ${notGiven}\nTotal Collection: ${money(total)}\n\n`;
  t+=filtered.map(m=>{
    const details=range.map(month=>{const p=reportPayment(m.code,month);return `${p?'✓':'✕'} ${reportMonthLabel(month)}${p?' - '+money(p.amount):''}`}).join(' | ');
    return `${m.name} (${m.code})${m.mobile?' - '+m.mobile:''}\n${details}`;
  }).join('\n\n');
  location.href='https://wa.me/?text='+encodeURIComponent(t);
}

 let a=[...data],n=$('sn').value,c=$('sc').value.trim().toLowerCase(),am=$('sa').value,q=$('sr').value.trim().toLowerCase();
 if(n)a=a.filter(x=>x.name===n);
 if(c)a=a.filter(x=>String(x.code||'').toLowerCase().includes(c));
 if(am)a=a.filter(x=>Number(x.amount)===Number(am));
 if(months.size)a=a.filter(x=>months.has(x.month));
 if(q)a=a.filter(x=>(x.remarks||'').toLowerCase().includes(q));
 let t=a.reduce((s,x)=>s+Number(x.amount||0),0);
 $('results').innerHTML=`<div class="small" style="padding:12px 0">${a.length} result(s) · Total ${money(t)}</div>`+
 a.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> <span class="small">${esc(x.code)}</span><div class="small">${esc(x.month)} · ${esc(x.remarks||'')}</div></div><b>${money(x.amount)}</b></div>`).join('')+
 (a.length?'':'<div class="small">No matching saved records.</div>');
}
function clearSearch(){$('sn').value='';$('sc').value='';$('sa').value='';$('sr').value='';months.clear();buildMonths();searchRows();}

$('doSearch').addEventListener('click',searchRows);
$('clearSearchBtn').addEventListener('click',clearSearch);
$('sc').addEventListener('input',()=>{
  const code=$('sc').value.trim().toLowerCase();
  const m=members.find(x=>String(x.code||'').toLowerCase()===code);
  if(m) $('sn').value=m.name;
  else if(!code) $('sn').value='';
});
$('sn').addEventListener('change',()=>{
  const name=$('sn').value;
  if(!name){ $('sc').value=''; return; }
  const m=members.find(x=>x.name===name);
  if(m) $('sc').value=m.code;
});


async function save(){if(!db)return toast('Database connection unavailable');
 let name=$('en').value,code=$('ec').value,amount=Number($('ea').value),month=$('em').value,remarks=$('er').value.trim();
 if(!name||!code||!amount||!month)return toast('Complete Name, Amount and Month');
 if(!members.some(m=>m.code===code && m.name===name))return toast('Select a saved Name & Code');
 if(data.some(x=>x.code===code&&x.month===month))return toast('Payment already saved for this month');
 let r0=await apiInsert('entries',{code,name,amount,month,remarks}); let r={data:r0.data?.[0],error:r0.error};
 if(r.error)return toast('Save failed');
 data.push(r.data);last={...r.data,date:new Date().toLocaleDateString('en-GB')};
 refresh();receipt();clearEntry();toast('✓ Payment saved');
}
$('saveBtn').addEventListener('click',save);

function clearEntry(){$('en').value='';$('ec').value='';$('ea').value='';$('em').value='';$('er').value='';}
$('clearBtn').addEventListener('click',clearEntry);

function receipt(){
 let r=last;
 $('receiptCard').classList.remove('hidden');
 $('receipt').innerHTML=`<h2>AYALVASIKAL</h2><div class="small" style="text-align:center">Payment Receipt</div>
 <div class="receiptLine"><span>Name</span><b>${esc(r.name)}</b></div>
 <div class="receiptLine"><span>Code</span><b>${esc(r.code)}</b></div>
 <div class="receiptLine"><span>Month</span><b>${esc(r.month)}</b></div>
 <div class="receiptLine"><span>Date</span><b>${r.date}</b></div>
 <div class="receiptLine"><span>Amount</span><b>${money(r.amount)}</b></div>
 <div class="receiptLine"><span>Remarks</span><b>${esc(r.remarks||'-')}</b></div>`;
 $('receiptCard').scrollIntoView({behavior:'smooth'});
}
function share(){
 if(!last)return;
 let r=last,t=`AYALVASIKAL\nPayment Receipt\n\nName: ${r.name}\nCode: ${r.code}\nMonth: ${r.month}\nDate: ${r.date}\nAmount: ${money(r.amount)}\nRemarks: ${r.remarks||'-'}`;
 location.href='https://wa.me/?text='+encodeURIComponent(t);
}
$('shareBtn').addEventListener('click',share);
$('printBtn').addEventListener('click',()=>window.print());

(async function bootAuth(){
  const saved=sessionStorage.getItem('ayalvasikal_user');
  if(saved){
    try{const x=JSON.parse(saved); const p=await loadCurrentProfile(x.username); if(p){setLoggedIn(p); await load(); return;}}catch(e){}
  }
  setLoggedOut();
})();
</script>
